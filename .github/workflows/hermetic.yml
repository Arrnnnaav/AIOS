# Hermetic lane only: desktop lanes (interactive/pixel/hung) need a real
# session and run one at a time locally (D025).
name: hermetic
on:
  push:
    branches: [feature/product-shell-task-graphs]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned bytes are LF (D125) and some tests walk commit history, so check
      # out the way a developer clone is: no CRLF conversion, full history.
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -m "not interactive and not pixel and not hung" -p no:cacheprovider -q
