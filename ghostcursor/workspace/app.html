<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<script>
// Before first paint, so the window never flashes the wrong scheme.
function applyTheme(t) { document.documentElement.dataset.theme = t; document.querySelector('meta[name="color-scheme"]').content = t; }
// No saved value = follow Windows. A saved value is the user's override and
// is kept even if Windows later switches to match it (e.g. a timed switch).
const lightSystem = matchMedia("(prefers-color-scheme: light)");
const systemTheme = () => (lightSystem.matches ? "light" : "dark");
function savedTheme() { try { const t = localStorage.getItem("orbyn-theme"); return t === "light" || t === "dark" ? t : null; } catch { return null; } }
applyTheme(savedTheme() ?? systemTheme());
lightSystem.addEventListener("change", () => { if (!savedTheme()) applyTheme(systemTheme()); });
</script>
<title>Orbyn</title>
<style>
:root {
  --bg: #0c0e13; --surface: #141720; --raise: #1b1f2a; --line: #262b38;
  --text: #e8eaf0; --dim: #9198a8; --faint: #5d6475;
  --amber: #f5b544; --amber-soft: rgba(245,181,68,.14);
  --cyan: #6cc6ff; --cyan-soft: rgba(108,198,255,.12);
  --green: #5fd49a; --red: #ff6b6b;
  --radius: 14px;
  color-scheme: dark;
}
:root[data-theme="light"] {
    --bg: #f6f6f3; --surface: #ffffff; --raise: #f0f0ec; --line: #e2e2dc;
    --text: #1a1c22; --dim: #5b6070; --faint: #686f7c;
    --amber: #c9840f; --amber-soft: rgba(201,132,15,.12);
    --cyan: #1b74c4; --cyan-soft: rgba(27,116,196,.10);
    color-scheme: light;
  }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; }

/* header */
header { padding: 14px 16px 10px; display: flex; gap: 12px; align-items: center; }
.orb {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--amber) 45%, #8a5310 100%);
  box-shadow: 0 0 18px var(--amber-soft), inset 0 -3px 6px rgba(0,0,0,.25);
}
.busy .orb { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 28px rgba(245,181,68,.55), inset 0 -3px 6px rgba(0,0,0,.25); transform: scale(1.06); } }
.titles { min-width: 0; flex: 1; }
.topic { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--dim); }
.iconbtn:hover:not(:disabled) { background: var(--raise); color: var(--text); }

nav { display: flex; gap: 4px; margin: 0 16px 8px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
nav button { flex: 1; padding: 6px 0; border-radius: 8px; color: var(--dim); font-weight: 500; font-size: 13px; }
nav button[aria-selected="true"] { background: var(--raise); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
nav .count { color: var(--faint); font-size: 11.5px; margin-left: 4px; }

/* live session bar */
#live { display: none; margin: 0 16px 8px; border-radius: var(--radius); padding: 10px 12px; background: var(--amber-soft); border: 1px solid rgba(245,181,68,.35); }
.busy #live { display: block; }
#live .row { display: flex; align-items: center; gap: 10px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245,181,68,.6); } 100% { box-shadow: 0 0 0 10px rgba(245,181,68,0); } }
#liveLabel { font-weight: 600; flex: 1; }
#liveStatus { color: var(--dim); font-size: 12.5px; margin-top: 4px; min-height: 1.2em; }
.pill { padding: 6px 12px; border: 1px solid transparent; border-radius: 999px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.pill.go { background: var(--amber); color: #201400; }
.pill.ghost { border: 1px solid var(--line); background: var(--surface); }
kbd { font: 11px ui-monospace, Consolas, monospace; padding: 1px 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; }

main { flex: 1; overflow-y: auto; padding: 4px 16px 16px; scroll-behavior: smooth; }
main { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
@supports not (scrollbar-color: auto) { main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 8px; } }
section[hidden] { display: none !important; }

/* chat */
.empty { text-align: left; padding: 24px 8px 0; }
.empty h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 650; }
.empty p { color: var(--dim); margin: 0 0 24px; max-width: 44ch; }
.starters { display: grid; gap: 8px; text-align: left; }
.starter { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.starter:hover { border-color: var(--amber); }
.starter b { display: block; font-weight: 600; }
.starter span { color: var(--dim); font-size: 12.5px; }
.starter svg { color: var(--amber); width: 20px; height: 20px; }
.welcome { padding: 14px; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--amber); border-radius: var(--radius); }
.welcome p { margin: 5px 0 12px; font-size: 13px; }
.welcome .sheetrow { flex-wrap: wrap; }

.msg { margin: 14px 0; display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--cyan-soft); border: 1px solid rgba(108,198,255,.22); border-radius: 16px 16px 4px 16px; padding: 8px 12px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .mini { width: 20px; height: 20px; margin-top: 2px; box-shadow: none; }
.msg.assistant .body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; max-width: 100%; }
.chip svg { width: 14px; height: 14px; color: var(--amber); }
.event { display: flex; justify-content: center; margin: 12px 0; }
.event .chip { white-space: normal; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tag svg { width: 13px; height: 13px; }
.claims { margin: 0; padding: 0; list-style: none; white-space: normal; }
.claims li { padding: 4px 0 4px 14px; position: relative; }
.claims li::before { content: ""; position: absolute; left: 0; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin-left: 3px; border-radius: 5px; background: var(--raise); color: var(--cyan); font-size: 11px; font-weight: 600; vertical-align: 1px; }
.status-note { font-size: 11.5px; color: var(--amber); margin-left: 4px; }
.sources { display: grid; gap: 6px; margin-top: 10px; white-space: normal; }
.source { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; }
.source:hover { border-color: var(--cyan); }
.source .n { color: var(--cyan); font-weight: 600; font-size: 12px; }
.source .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.source .k { color: var(--faint); font-size: 11.5px; }
.linkish { color: var(--cyan); font-size: 12.5px; margin-top: 6px; }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: .2; transform: translateY(-2px); } }

/* plan */
.panelhead { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 12px; }
.panelhead h3 { margin: 0; font-size: 15px; }
.rev { font-size: 11.5px; color: var(--faint); margin-left: 6px; font-weight: 400; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.step:hover { border-color: #3a4152; }
.num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); color: var(--amber); font-weight: 700; font-size: 12px; flex: none; }
.step .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.step .acts { display: flex; gap: 6px; margin-top: 8px; }
.step .acts button { font-size: 12.5px; color: var(--dim); padding: 3px 8px; border-radius: 7px; }
.step .acts button:hover { background: var(--raise); color: var(--text); }
.step .acts .show { color: var(--amber); font-weight: 600; }
.step input, .addrow input, .mem input, .ask input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
.addrow { display: flex; gap: 8px; margin-top: 10px; }
.cta { width: 100%; margin-top: 14px; padding: 11px; border-radius: 12px; background: var(--amber); color: #201400; font-weight: 700; display: flex; justify-content: center; gap: 8px; align-items: center; }
.secondary { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.secondary:hover:not(:disabled) { border-color: var(--amber); }
.note { color: var(--faint); font-size: 12px; margin-top: 14px; }
.blank { color: var(--dim); text-align: center; padding: 40px 12px; }
.blank svg { width: 32px; height: 32px; color: var(--faint); }
.planempty { margin-top: 18px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.planempty svg { width: 28px; height: 28px; color: var(--amber); }
.planempty h2 { font-size: 21px; letter-spacing: -.02em; margin: 18px 0 6px; }
.planempty p { color: var(--dim); max-width: 44ch; margin: 0 0 20px; }
.planempty .sheetrow { flex-wrap: wrap; }
.brainviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.brainviews button { padding: 8px 4px; border-radius: 8px; color: var(--dim); font-size: 13px; }
.brainviews button[aria-pressed="true"] { background: var(--raise); color: var(--text); font-weight: 600; }
.brain-title { font-size: 18px; margin: 10px 0 12px; }

/* brain */
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; min-height: 28px; }
.switch i { width: 34px; height: 20px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); position: relative; transition: .2s; }
.switch i::after { content: ""; position: absolute; width: 14px; height: 14px; top: 2px; left: 2px; border-radius: 50%; background: var(--dim); transition: .2s; }
.switch[aria-checked="true"] i { background: var(--amber-soft); border-color: var(--amber); }
.switch[aria-checked="true"] i::after { left: 16px; background: var(--amber); }
.mems { display: grid; gap: 8px; }
.mem { padding: 10px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.mem .meta { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--faint); margin-bottom: 3px; }
.kind { color: var(--amber); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
/* Company Brain rows: long text wraps, the actions keep their size. */
.knowtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.knowsrc { color: var(--faint); font-size: 12px; margin-left: 8px; }
.knowacts { display: flex; gap: 6px; flex: none; margin-left: 10px; }
.knowacts button { margin-left: 0 !important; white-space: nowrap; }
.chip { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--raise); color: var(--faint); vertical-align: 1px; }
.chip.approved, .chip.reviewed { color: var(--amber); }
.chip.private { color: var(--text); }
.mem .acts { display: flex; gap: 4px; margin-left: auto; }
.mem .acts button { color: var(--faint); font-size: 12px; padding: 1px 6px; border-radius: 6px; }
.mem .acts button:hover { color: var(--text); background: var(--raise); }
.danger { color: var(--red) !important; }
.workhead { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
.workhead h3 { margin: 0; flex: 1; font-size: 16px; }
.worklist { display: grid; gap: 8px; }
.workcard { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.workcard.running { border-color: var(--amber); background: var(--amber-soft); }
.workcard b { flex: 1; min-width: 0; }
.workstate { color: var(--dim); font-size: 12px; }
.workcard.running .workstate { color: var(--amber); }
.workcard button { color: var(--cyan); font-size: 12px; font-weight: 600; }
.workcard button:hover { text-decoration: underline; }
.joblist { display: grid; gap: 8px; margin-bottom: 18px; }
.jobcard { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.jobcard .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); font-size: 12px; }
.jobcard p { margin: 6px 0; overflow-wrap: anywhere; }
.jobcard .sheetrow { margin-top: 8px; flex-wrap: wrap; }
.jobcard .sheetrow button { color: var(--cyan); font-size: 12px; font-weight: 600; }
.jobanswer { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
.workstage { background: #131a2a; color: #f5f3ed; border-radius: 20px; padding: 12px; margin: 4px 0 18px; overflow: hidden; position: relative; }
.workstage:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.workstage::before { content: ""; position: absolute; width: 230px; height: 230px; border: 1px solid rgba(245,181,68,.18); border-radius: 50%; right: -105px; top: -125px; pointer-events: none; }
.workstagebar { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; position: relative; }
.workstagebar strong { flex: 1; font-size: 13px; }
.workstagebar span { font-size: 12px; color: #b5becd; }
.workstagebar button { width: 27px; height: 27px; border-radius: 8px; border: 1px solid #485163; font-size: 19px; line-height: 1; }
.workstagebar button:hover:not(:disabled) { background: #313b50; }
.workstagebar button:disabled { opacity: .35; }
.workstagecard { min-height: 148px; padding: 14px; border-radius: 14px; background: #f4f0e7; color: #202633; display: flex; flex-direction: column; gap: 6px; animation: work-reveal .18s ease-out; }
@keyframes work-reveal { from { opacity: .45; transform: translateX(12px); } }
.workstagecard .eyebrow { color: #646e7b; font-size: 11px; font-weight: 700; }
.workstagecard h4 { margin: 0; font-size: 17px; line-height: 1.25; }
.workstagecard p { margin: 0; color: #3c4653; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.workstagecard .stageaction { align-self: flex-start; margin-top: auto; border-radius: 999px; background: #25334d; color: white; padding: 6px 12px; font-size: 12px; font-weight: 600; }
.workstagecard .stageaction:hover:not(:disabled) { background: #354e76; }
.workstagecard .stageaction:focus-visible { outline-color: #ba7600; }
.fileask { display: grid; gap: 10px; }
.fileask label { display: grid; gap: 4px; font-size: 13px; }
.fileask textarea { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 8px; min-height: 70px; }
.fileask .mem { white-space: pre-wrap; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-size: 17px; }
.stat span { color: var(--faint); font-size: 11.5px; }

.ideas { display: grid; gap: 10px; margin: 0 0 16px; }
.idea { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; text-align: left; }
.idea button { justify-self: start; }
/* composer */
footer { padding: 8px 12px 12px; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 6px 12px; transition: border-color .15s; }
.composer:focus-within { border-color: #3d4456; }
.composer.research { border-color: var(--cyan); }
textarea { width: 100%; resize: none; border: 0; background: none; color: var(--text); font: inherit; max-height: 160px; min-height: 24px; padding: 4px 0; outline: none; }
textarea::placeholder { color: var(--faint); }
#input { field-sizing: content; }
.tools { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.tool { height: 30px; padding: 0 9px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12.5px; }
.tool:hover:not(:disabled) { background: var(--raise); color: var(--text); }
.tool[aria-pressed="true"] { background: var(--cyan-soft); color: var(--cyan); }
.send { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--amber); color: #201400; display: grid; place-items: center; }
.send svg { width: 16px; height: 16px; }
.fine { color: var(--faint); font-size: 11px; text-align: center; margin-top: 6px; }

/* sheet */
.sheet::backdrop { background: rgba(0,0,0,.5); overflow: hidden; overscroll-behavior: contain; }
.sheet { width: 100%; max-width: 100%; max-height: 80%; margin: auto auto 0; overflow-y: auto; overscroll-behavior: contain; color: var(--text); border: 0; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px; animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.ask { width: min(420px, calc(100% - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); overscroll-behavior: contain; }
.ask::backdrop { background: rgba(0,0,0,.5); overflow: hidden; overscroll-behavior: contain; }
.ask p { margin: 0 0 12px; }
.ask input { margin-bottom: 12px; }
.ask .sheetrow { justify-content: flex-end; }
.sheet h3 { margin: 0 0 2px; font-size: 16px; }
.sheet p { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
.wins { display: grid; gap: 6px; margin-bottom: 12px; }
.win { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.win:has(input:checked) { border-color: var(--amber); background: var(--amber-soft); }
.win input { accent-color: var(--amber); }
.win .app { font-weight: 600; font-size: 13px; }
.win .title { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win > div { min-width: 0; }
.sheetrow { display: flex; gap: 8px; align-items: center; }
select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px; }
.alts { display: grid; gap: 6px; margin: 10px 0; }

#toast { position: fixed; left: 16px; right: 16px; bottom: 120px; padding: 10px 14px; border-radius: 12px; background: #2a1517; border: 1px solid rgba(255,107,107,.4); color: #ffd6d6; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 20; }
#toast.ok { background: #13261d; border-color: rgba(95,212,154,.4); color: #d4ffe8; }
#toast.show { opacity: 1; transform: none; }
@media (min-width: 760px) {
  header, main, footer { width: min(100%, 760px); margin-inline: auto; }
  nav { width: min(calc(100% - 32px), 728px); margin-inline: auto; }
  .sheet { max-width: 760px; margin-inline: auto; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="orb" aria-hidden="true"></div>
  <div class="titles">
    <div class="topic" id="topic">Workspace</div>
    <div class="goal" id="goal">Tell Orbyn what you want to get done</div>
  </div>
  <button class="iconbtn" id="themeBtn" title="Switch light/dark" aria-label="Switch theme"></button>
</header>
<nav role="tablist">
  <button id="nav-chat" role="tab" data-tab="chat" aria-controls="tab-chat" aria-selected="true" tabindex="0">Chat</button>
  <button id="nav-plan" role="tab" data-tab="plan" aria-controls="tab-plan" aria-selected="false" tabindex="-1">Plan<span class="count" id="planCount"></span></button>
  <button id="nav-brain" role="tab" data-tab="brain" aria-controls="tab-brain" aria-selected="false" tabindex="-1">Brain<span class="count" id="memCount"></span></button>
  <button id="nav-work" role="tab" data-tab="work" aria-controls="tab-work" aria-selected="false" tabindex="-1">Work<span class="count" id="workCount"></span></button>
</nav>
<div id="live" role="status" aria-live="polite">
  <div class="row">
    <span class="pulse"></span><span id="liveLabel">Working</span>
    <button class="pill go" id="doneBtn" hidden></button>
    <button class="pill ghost" id="stopBtn">Stop <kbd>Esc</kbd></button>
  </div>
  <div id="liveStatus"></div>
</div>
<main id="main">
  <section id="tab-chat" role="tabpanel" aria-labelledby="nav-chat"><div id="thread"></div></section>
  <section id="tab-plan" role="tabpanel" aria-labelledby="nav-plan" hidden></section>
  <section id="tab-brain" role="tabpanel" aria-labelledby="nav-brain" hidden></section>
  <section id="tab-work" role="tabpanel" aria-labelledby="nav-work" hidden></section>
</main>
<footer>
  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message Orbyn…" aria-label="Message"></textarea>
    <div class="tools">
      <button class="tool" id="pointBtn" title="Point at something on screen"></button>
      <button class="tool" id="voiceBtn" title="Say it instead of typing"></button>
      <button class="tool" id="researchBtn" aria-pressed="false" title="Answer from cited web sources"></button>

</footer>

    <div class="sheetrow"><button type="button" class="secondary" id="askCancel">Cancel</button><button value="ok" id="askOk">OK</button></div>
  </form>
</dialog>
<div id="toast" role="alert"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const ICON = {
  point: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2.5-7.5L21 10z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 0V7a3 3 0 0 0-3-3zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 0"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
};
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // model text only ever goes in as text
  return n;
}
function iconEl(name, tag = "span") { const n = el(tag); n.innerHTML = ICON[name]; return n.firstChild; }

async function api(action, body = {}) {
  const r = await fetch("/api/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Orbyn-Token": TOKEN },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "request refused");
  return data;
}
let toastTimer;
function toast(text, ok = false) {
  text = String(text || ""); text = text.charAt(0).toUpperCase() + text.slice(1);  // server messages start lowercase
  const t = $("toast"); t.textContent = text; t.className = "show" + (ok ? " ok" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ok ? "ok" : ""), 3600);
}
async function act(action, body, quietOk) {
  try { const r = await api(action, body); if (quietOk) toast(quietOk, true); await poll(true); return r; }
  catch (e) { toast(e.message); await poll(true); return null; }
}

// ---- state ------------------------------------------------------------
let S = null, lastJson = "", tab = "chat", brainView = "personal", researchMode = false, pending = "", workCardIndex = 0, backgroundStarting = false, showArchived = false;
let welcomeSeen = false;
try { welcomeSeen = localStorage.getItem("orbyn-welcome-v1") === "seen"; } catch {}
function finishWelcome() {
  welcomeSeen = true;
  try { localStorage.setItem("orbyn-welcome-v1", "seen"); } catch {}
}
let githubRepos = [], githubIssues = {}, githubLoading = false;
let chosen = new Set(), editing = null;

let pollSeq = 0, pollShown = 0;
async function poll(force) {
  const seq = ++pollSeq;  // polls overlap; an older reply must not undo a newer one
  let s;
  try { s = await api("state"); } catch { return; }
  if (seq < pollShown) return;
  pollShown = seq;
  const json = JSON.stringify(s);
  if (s.offered_file) takeOfferedFile();  // before the early return: a sheet may have closed since
  if (!force && json === lastJson) return;
  const busyChanged = !S || S.busy !== s.busy;
  if (busyChanged) workCardIndex = 0;
  lastJson = json; S = s;
  render(busyChanged);
}
setInterval(poll, 700);

function render(busyChanged) {
  document.body.classList.toggle("busy", !!S.busy);
  $("topic").textContent = S.topic.replace(/-/g, " ");
  $("goal").textContent = S.goal || "Tell Orbyn what you want to get done";
  $("planCount").textContent = S.plan ? S.plan.steps.length : "";
  $("memCount").textContent = S.memories.length || "";
  $("workCount").textContent = S.activity.length || "";
  renderLive();
  ["pointBtn", "voiceBtn", "researchBtn", "sendBtn"].forEach((id) => ($(id).disabled = !!S.busy));
  $("input").disabled = !!S.busy && S.busy !== "Listening";
  if (tab === "chat") renderChat(busyChanged);
  else if (tab === "plan") renderPlan();
  else if (tab === "brain") renderBrain();
  else renderWork();
}

function renderWork() {
  const root = $("tab-work");
  const focusedCardControl = root.contains(document.activeElement) ? document.activeElement.dataset.workFocus : null;
  root.replaceChildren();
  const head = el("div", "workhead");
  head.append(el("h3", "", "Work"));
  const fileAsk = el("button", "secondary", "Ask a file"); fileAsk.dataset.workFocus = "askfile"; fileAsk.disabled = !!S.busy; fileAsk.onclick = openFileAsk;
  head.append(fileAsk);
  const linkAsk = el("button", "secondary", "Ask a link"); linkAsk.disabled = !!S.busy;
  linkAsk.onclick = async () => {
    const url = await askText("Paste a web address (https://) of a page or a PDF to read and ask about. Orbyn fetches the page itself; only the passages that match your question go to your model.");
    if (!url) return;
    linkAsk.disabled = true; linkAsk.textContent = "Reading\u2026";
    const page = await act("read_link", { url: url.trim() });
    linkAsk.disabled = false; linkAsk.textContent = "Ask a link";
    if (page) openFileAsk(page);
  };
  head.append(linkAsk);
  const fresh = el("button", "pill go", "New task");
  fresh.dataset.workFocus = "newtask";
  fresh.onclick = () => { setTab("chat"); $("input").focus(); };
  head.append(fresh); root.append(head);
  const stage = workStage(); root.append(stage);
  root.append(backgroundJobs());
  root.append(routinesCard());
  root.append(githubCard());
  root.append(inboxCard());
  root.append(el("h3", "", "Recent work"));
  if (!S.activity.length) {
    root.append(el("p", "note", "Tasks started here appear below. Create a task or run a saved agent."));
  } else {
    const list = el("div", "worklist");
    for (const item of S.activity) {
      const card = el("div", "workcard" + (item.state === "running" ? " running" : ""));
      card.append(el("b", "", item.label), el("span", "workstate", item.state));
      if (item.state === "running" && S.busy) {
        const stop = el("button", "", "Stop"); stop.onclick = () => api("stop").catch((e) => toast(e.message)); card.append(stop);
      } else if (item.label === "Asking file") {
        const again = el("button", "", "Ask another"); again.disabled = !!S.busy; again.onclick = openFileAsk; card.append(again);
      } else if (item.state === "finished") {
        const destination = ["Planning", "Editing plan", "Guiding", "Acting"].includes(item.label) ? "plan" : "chat";
        const open = el("button", "", destination === "plan" ? "Go to Plan" : "Go to Chat");
        open.onclick = () => setTab(destination); card.append(open);
      }
      list.append(card);
    }
    root.append(list);
    root.append(el("p", "note", "The latest 20 states are saved locally. Interrupted work is not resumed after restart."));
  }
  root.append(agentsCard());
  if (focusedCardControl) {
    const target = root.querySelector('[data-work-focus="' + focusedCardControl + '"]');
    (target && !target.disabled ? target : stage).focus({ preventScroll: true });
  }
}

function backgroundJobs() {
  const wrap = el("div");
  const head = el("div", "workhead");
  head.append(el("h3", "", "Background jobs"));
  const start = el("button", "secondary", "Start a background job"); start.dataset.workFocus = "background"; start.disabled = !!S.busy; start.onclick = openBackgroundResearch;
  head.append(start); wrap.append(head);
  const active = S.jobs.filter(job => !job.archived), archived = S.jobs.filter(job => job.archived);
  if (!archived.length) showArchived = false;
  if (archived.length) {
    const toggle = el("button", "secondary", showArchived ? "Hide archived" : "Show archived (" + archived.length + ")");
    toggle.dataset.workFocus = "archive-toggle"; toggle.onclick = () => { showArchived = !showArchived; renderWork(); };
    wrap.append(toggle, el("p", "note", "Archived results share the 20-job inbox. Keep a result to protect it from the trim."));
  }
  const visible = showArchived ? active.concat(archived) : active;
  if (!visible.length) { wrap.append(el("p", "note", archived.length ? "Archived results are hidden." : "Start cited research here. It can finish after you close this window.")); return wrap; }
  const list = el("div", "joblist");
  for (const job of visible) {
    const card = el("article", "jobcard");
    const meta = el("div", "meta"); meta.append(el("b", "", job.routine ? "Routine research" : ({ deep: "Deep research", crew: "Crew" })[job.kind] || "Research"), el("span", "", [job.archived ? "Archived" : "", job.pinned ? "Kept" : "", job.state, job.new_claims ? `${job.new_claims.length} new since last run` : ""].filter(Boolean).join(" · ")));
    card.append(meta, el("p", "", job.question));
    const actions = el("div", "sheetrow");
    if (job.state === "running") {
      const stop = el("button", "", "Stop"); stop.dataset.workFocus = "job-" + job.id;
      stop.onclick = () => act("job_cancel", { id: job.id }); actions.append(stop);
    } else {
      if (job.answer) {
        const open = el("button", "", "View result"); open.dataset.workFocus = "job-" + job.id;
        open.onclick = () => openJobResult(job); actions.append(open);
        const download = el("button", "secondary", "Download Markdown");
        download.dataset.workFocus = "download-" + job.id;
        download.onclick = () => downloadJobResult(job); actions.append(download);
        const pin = el("button", "secondary", job.pinned ? "Unkeep" : "Keep");
        pin.dataset.workFocus = "pin-" + job.id;
        pin.onclick = () => act("job_pin", { id: job.id, pinned: !job.pinned }); actions.append(pin);
        const archive = el("button", "secondary", job.archived ? "Restore" : "Archive");
        archive.dataset.workFocus = "archive-" + job.id;
        archive.onclick = () => act("job_archive", { id: job.id, archived: !job.archived }); actions.append(archive);
      }
      const remove = el("button", "", "Remove"); remove.classList.add("danger"); remove.style.marginLeft = "auto";
      remove.onclick = async () => { if (await askConfirm(job.pinned ? "Remove this kept result?" : "Remove this saved job result?", "Remove")) act("job_delete", { id: job.id }, "Job removed"); };
      actions.append(remove);
    }
    card.append(actions); list.append(card);
  }
  wrap.append(list); return wrap;
}

function openBackgroundResearch() {
  sheetOpener = document.activeElement;
  const sheet = $("sheet"); const heading = el("h3", "", "Start a background job"); heading.id = "backgroundTitle";
  sheet.setAttribute("aria-labelledby", heading.id);
  sheet.replaceChildren(heading, el("p", "", "Jobs use web search and your configured model, and never click or type for you. The question and answer are saved locally in this workspace; the job keeps running if you close the window."));
  const kind = el("select"); kind.setAttribute("aria-label", "Job kind");
  for (const [value, label] of [["research", "Research: one cited answer"], ["deep", "Deep research: several parts, cited claims filed to the Brain for review"], ["crew", "Crew: split a goal into steps and run them (plans are only proposed)"]]) {
    const option = el("option", "", label); option.value = value; kind.append(option);
  }
  const question = el("textarea"); question.maxLength = 500; question.rows = 3; question.placeholder = "What should Orbyn work on?"; question.setAttribute("aria-label", "Job question or goal");
  const row = el("div", "sheetrow");
  const cancel = el("button", "secondary", "Close"); cancel.onclick = closeSheet;
  const start = el("button", "pill go", "Start job"); start.style.marginLeft = "auto";
  start.onclick = async () => {
    const text = question.value.trim(); if (!text) return toast("Enter a question or goal.");
    start.disabled = true; backgroundStarting = true;
    try { await api("job_start", { question: text, kind: kind.value }); closeSheet(); await poll(true); }
    catch (e) { toast(e.message); }
    finally { backgroundStarting = false; start.disabled = false; }
  };
  row.append(cancel, start); sheet.append(kind, question, row); openSheet(); question.focus();
}

// What ask() actually sent (scrubbed, matching passages only), shown on demand.
function sentDetails(sent, total) {
  const box = el("details", "sent"); box.hidden = !sent;
  if (sent) {
    box.append(el("summary", "", `Sent ${sent.length.toLocaleString()} of ${total.toLocaleString()} characters to the model`));
    const text = el("pre", "", sent); text.style.whiteSpace = "pre-wrap"; box.append(text);
  }
  return box;
}

function openJobResult(job) {
  sheetOpener = document.activeElement;
  const sheet = $("sheet"); const heading = el("h3", "", "Research result"); heading.id = "jobResultTitle";
  sheet.setAttribute("aria-labelledby", heading.id);
  const close = el("button", "secondary", "Close"); close.onclick = closeSheet;
  const follow = el("textarea"); follow.rows = 2; follow.maxLength = 500; follow.placeholder = "Ask about this result"; follow.setAttribute("aria-label", "Question about this result");
  const reply = el("div", "jobanswer"); reply.hidden = true; reply.tabIndex = -1; reply.setAttribute("role", "status");
  const ask = el("button", "pill go", "Ask about result"); ask.disabled = !!S.busy;
  const stop = el("button", "secondary", "Stop"); stop.hidden = true; stop.id = "jobAskStop";
  stop.onclick = () => api("stop").catch((e) => toast(e.message));
  ask.onclick = async () => {
    const text = follow.value.trim(); if (!text) return toast("Ask a question about this result.");
    ask.disabled = true; ask.textContent = "Asking…"; stop.hidden = false;
    try {
      const result = await api("job_ask", { id: job.id, text });
      reply.textContent = result.answer; reply.hidden = false; sheet.querySelector("details.sent")?.remove(); reply.after(sentDetails(result.sent, job.answer.length)); reply.focus(); await poll(true);
    } catch (e) { toast(e.message); }
    finally { ask.disabled = false; ask.textContent = "Ask about result"; stop.hidden = true; }
  };
  const changed = el("div", "note");
  if (job.new_claims) changed.textContent = job.new_claims.length ? "New since last run:\n" + job.new_claims.map((c) => "• " + c).join("\n") : "Nothing new since last run.";
  changed.hidden = !job.new_claims; changed.style.whiteSpace = "pre-wrap";
  sheet.replaceChildren(heading, el("p", "", job.question), changed, el("div", "jobanswer", job.answer), el("p", "note", "Follow-up sends the parts of this saved result that match your question (up to 8,000 characters) to your configured model. The question and reply are not saved."), follow, reply, ask, stop, close);
  openSheet(); close.focus();
}

function downloadJobResult(job) {
  const url = URL.createObjectURL(new Blob(["# ", job.question, "\n\n", job.answer, "\n"], { type: "text/markdown;charset=utf-8" }));
  const link = document.createElement("a"); link.href = url; link.download = "orbyn-research.md"; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function routinesCard() {
  const wrap = el("div"); const head = el("div", "workhead");
  head.append(el("h3", "", "Routines"));
  const add = el("button", "secondary", "New routine"); add.dataset.workFocus = "routine-add"; add.onclick = openRoutine;
  head.append(add); wrap.append(head);
  wrap.append(el("p", "note", "Scheduled research runs while Orbyn and this PC are awake. Closing the window keeps enabled routines active. One missed run starts after wake, with no catch-up burst. A failed run tries again after 5 minutes, then waits longer each time, up to an hour."));
  for (const question of (S.suggested_routines || [])) {
    const card = el("article", "jobcard");
    const meta = el("div", "meta"); meta.append(el("b", "", "Suggestion"), el("span", "", "You have asked this more than once"));
    card.append(meta, el("p", "", question));
    const row = el("div", "sheetrow");
    const yes = el("button", "secondary", "Make it a daily routine"); yes.onclick = () => act("routine_create", { question, cadence: "daily" }, "Routine created"); row.append(yes);
    const no = el("button", "secondary", "Not now"); no.style.marginLeft = "auto"; no.onclick = () => act("routine_dismiss", { question }); row.append(no);
    card.append(row); wrap.append(card);
  }
  for (const item of S.routines) {
    const card = el("article", "jobcard");
    const meta = el("div", "meta"); meta.append(el("b", "", item.cadence + " research"), el("span", "", item.enabled ? "Next " + new Date(item.next_due * 1000).toLocaleString() : "Paused"));
    card.append(meta, el("p", "", item.question));
    const row = el("div", "sheetrow");
    const run = el("button", "secondary", "Run now"); run.disabled = !!S.busy; run.onclick = () => act("routine_run", { id: item.id }, "Research started"); row.append(run);
    const toggle = el("button", "secondary", item.enabled ? "Pause" : "Resume"); toggle.onclick = () => act(item.enabled ? "routine_pause" : "routine_resume", { id: item.id }); row.append(toggle);
    const remove = el("button", "danger", "Delete"); remove.style.marginLeft = "auto"; remove.onclick = async () => { if (await askConfirm("Delete this routine? Saved results stay in Background jobs.", "Delete")) act("routine_delete", { id: item.id }); }; row.append(remove);
    card.append(row); wrap.append(card);
  }
  if (S.routines.length) {
    const quit = el("button", "secondary", "Quit Orbyn"); quit.onclick = async () => { if (await askConfirm("Quit Orbyn and stop scheduled routines until you reopen it?", "Quit")) { try { await api("quit"); window.close(); } catch (e) { toast(e.message); } } }; wrap.append(quit);
  }
  return wrap;
}

function openRoutine() {
  sheetOpener = document.activeElement;
  const sheet = $("sheet"); const heading = el("h3", "", "Schedule research"); heading.id = "routineTitle";
  sheet.setAttribute("aria-labelledby", heading.id);
  sheet.replaceChildren(heading, el("p", "", "At each due time, Orbyn sends this question to web search and your configured model and saves the result locally. Orbyn stays running after you close this window."));
  const question = el("textarea"); question.maxLength = 500; question.rows = 3; question.placeholder = "What should Orbyn research?"; question.setAttribute("aria-label", "Research question");
  const cadence = el("select"); cadence.setAttribute("aria-label", "Schedule");
  for (const name of ["hourly", "daily", "weekdays", "weekly"]) { const option = el("option", "", name[0].toUpperCase() + name.slice(1)); option.value = name; cadence.append(option); }
  const row = el("div", "sheetrow"); const close = el("button", "secondary", "Close"); close.onclick = closeSheet;
  const save = el("button", "pill go", "Create routine"); save.style.marginLeft = "auto";
  save.onclick = async () => { if (!question.value.trim()) return toast("Enter a research question."); save.disabled = true; try { await api("routine_create", { question: question.value, cadence: cadence.value }); closeSheet(); await poll(true); } catch (e) { toast(e.message); } finally { save.disabled = false; } };
  row.append(close, save); sheet.append(question, cadence, row); openSheet(); question.focus();
}

// ---- calendar & mail: read-only, on this PC, never sent to a model --------
let inboxEvents = null, inboxMail = null;
function inboxCard() {
  const wrap = el("div"); const head = el("div", "workhead"); head.append(el("h3", "", "Calendar & mail · read only"));
  wrap.append(head, el("p", "note", "Orbyn reads your calendar's private iCalendar address and your inbox headers directly from this PC. Nothing is marked read, changed, or sent to a model; secrets stay in Windows Credential Manager."));
  const row = el("div", "sheetrow");
  if (S.calendar_connected) {
    const today = el("button", "secondary", "Today's calendar");
    today.onclick = async () => { try { inboxEvents = (await api("calendar_agenda", { days: 1 })).events; renderWork(); } catch (e) { toast(e.message); } };
    const off = el("button", "secondary", "Disconnect calendar");
    off.onclick = async () => { if (await askConfirm("Remove the calendar address from Windows Credential Manager?", "Remove")) { await act("calendar_disconnect", {}, "Calendar disconnected"); inboxEvents = null; } };
    row.append(today, off);
  } else {
    const on = el("button", "secondary", "Connect calendar");
    on.onclick = async () => { const url = await askText("Paste your calendar's private iCalendar (ICS) address (starts with https://):"); if (url) act("calendar_connect", { url }, "Calendar connected"); };
    row.append(on);
  }
  if (S.mail_connected) {
    const unread = el("button", "secondary", "Unread mail");
    unread.onclick = async () => { try { inboxMail = (await api("mail_unread", {})).mail; renderWork(); } catch (e) { toast(e.message); } };
    const off = el("button", "secondary", "Disconnect mail");
    off.onclick = async () => { if (await askConfirm("Remove the mail sign-in from Windows Credential Manager?", "Remove")) { await act("mail_disconnect", {}, "Mail disconnected"); inboxMail = null; } };
    row.append(unread, off);
  } else {
    const on = el("button", "secondary", "Connect mail");
    on.onclick = openMailConnect; row.append(on);
  }
  wrap.append(row);
  if (inboxEvents) {
    if (!inboxEvents.length) wrap.append(el("p", "note", "Nothing on the calendar today."));
    for (const e of inboxEvents) wrap.append(el("p", "", (e.all_day ? "All day" : e.start.slice(11, 16)) + "  " + e.title + (e.location ? " (" + e.location + ")" : "")));
  }
  if (inboxMail) {
    if (!inboxMail.length) wrap.append(el("p", "note", "No unread mail."));
    for (const m of inboxMail) wrap.append(el("p", "", m.from + ": " + m.subject));
  }
  return wrap;
}

function openMailConnect() {
  sheetOpener = document.activeElement;
  const sheet = $("sheet"); const heading = el("h3", "", "Connect mail (read only)"); heading.id = "mailTitle";
  sheet.setAttribute("aria-labelledby", heading.id);

function turnEl(t) {
  const text = t.text;
  if (t.speaker === "user" && text.startsWith(S.point_prefix)) {
    const w = el("div", "event"); const c = el("span", "chip"); c.append(iconEl("point"), document.createTextNode(text.slice(S.point_prefix.length).trim())); w.append(c); return w;
  }
  if (t.speaker === "assistant" && /^\[teach r\d+\]/.test(text)) {
    const w = el("div", "event"); const c = el("span", "chip"); c.append(iconEl("check"), document.createTextNode(text.replace(/^\[teach (r\d+)\]\s*/, "Guided plan $1 — "))); w.append(c); return w;
  }
  if (t.speaker === "assistant" && /^\[plan r\d+, a proposal/.test(text)) {
    const w = el("div", "event"); const c = el("button", "chip"); c.append(iconEl("plan"), document.createTextNode("Plan revision " + text.match(/^\[plan r(\d+)/)[1] + " — open Plan")); c.onclick = () => setTab("plan"); w.append(c); return w;
  }
  const m = el("div", "msg " + (t.speaker === "user" ? "user" : "assistant"));
  if (t.speaker === "user") {
    const b = el("div", "bubble");
    if (text.startsWith("[research] ")) { const tg = el("div", "tag"); tg.append(iconEl("globe"), document.createTextNode("Research")); b.append(tg, document.createTextNode(text.slice(11))); }
    else b.textContent = text;
    m.append(b);
  } else {
    m.append(el("div", "orb mini"));
    const body = el("div", "body");
    if (text.includes("\nSources:") || text.startsWith("No answer:")) body.append(researchEl(text)); else body.textContent = text;
    m.append(body);
  }
  return m;
}

function researchEl(text) {
  const frag = document.createDocumentFragment();
  const [claimPart, srcPart = ""] = text.split("\nSources:");
  const ul = el("ul", "claims");
  for (const line of claimPart.split("\n")) {
    if (!line.startsWith("- ")) { if (line.trim()) frag.append(el("div", "", line)); continue; }
    const li = el("li");
    const m = line.slice(2).match(/^(.*?)(\s\((contradicted|unsupported|disputed|[a-z ]+)\))?((?:\s?\[[^\]]+\])*)$/);
    li.append(document.createTextNode(m ? m[1] : line.slice(2)));
    if (m && m[3]) li.append(el("span", "status-note", m[3]));
    if (m && m[4]) for (const c of m[4].matchAll(/\[([^\]]+)\]/g)) li.append(el("span", "cite", c[1]));
    ul.append(li);
  }
  if (ul.childElementCount) frag.prepend(ul);
  const srcs = el("div", "sources");
  for (const line of srcPart.split("\n")) {
    const m = line.match(/^\s*\[([^\]]+)\]\s(.*?)\s--\s(.*?)\s--\s(\S+)\s*$/);
    if (!m) continue;
    const safe = /^https?:\/\//i.test(m[4]);
    const a = el(safe ? "a" : "div", "source");
    if (safe) { a.href = m[4]; a.target = "_blank"; a.rel = "noopener noreferrer"; }
    let host = ""; try { host = new URL(m[4]).hostname.replace(/^www\./, ""); } catch {}
    a.append(el("span", "n", m[1]), el("span", "t", m[2] || host), el("span", "k", host + " · " + m[3]));
    srcs.append(a);
  }
  if (srcs.childElementCount) frag.append(srcs);
  return frag;
}

// One row's text: a status chip, the fact, then where it came from.
function knowLabel(status, sensitive, text, source) {
  const label = el("span", "knowtext");
  label.append(el("span", "chip " + status, status));
  if (sensitive) label.append(el("span", "chip private", "private"));
  label.append(el("span", "", text), el("span", "knowsrc", source));
  return label;
}

      if (f.expired || f.status === "retired" || f.status === "superseded") label.style.opacity = "0.55";
      const rt = el("span", "knowacts");
      if (f.status === "candidate") { const b = el("button", "pill go", "Review"); b.onclick = () => act("know_review", { fid: f.fid }, "Reviewed").then(renderBrain); rt.append(b); }
      if (f.status === "reviewed") { const b = el("button", "pill go", "Approve"); b.onclick = () => act("know_approve", { fid: f.fid }, "Approved").then(renderBrain); rt.append(b); }
      if (f.status !== "retired" && f.status !== "superseded") { const b = el("button", "secondary", "Retire"); b.style.marginLeft = "6px"; b.onclick = () => act("know_retire", { fid: f.fid }, "Retired").then(renderBrain); rt.append(b); }
      if ((f.status === "reviewed" || f.status === "approved") && !f.expired) { const b = el("button", "secondary", "Expire"); b.style.marginLeft = "6px"; b.title = "Stopped being true now; kept as history"; b.onclick = () => act("know_expire", { fid: f.fid }, "Expired").then(renderBrain); rt.append(b); }
      { const b = el("button", "secondary", f.sensitive ? "Unmark" : "Private"); b.style.marginLeft = "6px"; b.title = f.sensitive ? "Allow this fact on the model path again" : "Keep this fact off the model path"; b.onclick = () => act("know_classify", { fid: f.fid, sensitive: !f.sensitive }, f.sensitive ? "Unmarked" : "Private").then(renderBrain); rt.append(b); }
      row.append(label, rt); list.append(row);
    }
  }).catch(() => {});
  const relCap = el("div", "sheetrow"); relCap.style.marginTop = "8px";
  const subj = el("input"); subj.placeholder = "subject"; subj.style.flex = "1";
  const pred = el("input"); pred.placeholder = "predicate"; pred.style.flex = "1"; pred.style.marginLeft = "6px";
  const obj = el("input"); obj.placeholder = "object"; obj.style.flex = "1"; obj.style.marginLeft = "6px";
  const sens = el("input"); sens.type = "checkbox"; sens.style.marginLeft = "8px";
  const sensL = el("label", "note", "private"); sensL.title = "Keep this relationship off the model path"; sensL.prepend(sens);
  const relB = el("button", "pill go", "Add link"); relB.style.marginLeft = "6px";
  relB.onclick = () => {
    const s = subj.value.trim(), p = pred.value.trim(), o = obj.value.trim();
    if (!s || !p || !o) return;
    act("know_relate", { subject: s, predicate: p, object: o, sensitive: sens.checked }).then((r) => { if (!r) return; toast(r.duplicate ? "Already in the Brain" : "Added as candidate", true); subj.value = pred.value = obj.value = ""; sens.checked = false; renderBrain(); });
  };
  for (const field of [subj, pred, obj]) field.onkeydown = (e) => { if (e.key === "Enter" && !imeEnter(e)) relB.onclick(); };
  relCap.append(subj, pred, obj, sensL, relB); card.append(relCap);
  // Private sources: new knowledge from a matching source is sensitive at entry (D186).
  const psCap = el("div", "sheetrow"); psCap.style.marginTop = "8px";
  const psIn = el("input"); psIn.placeholder = "private source (e.g. 1Password)"; psIn.style.flex = "1";
  psIn.title = "New facts/links from a source matching this stay off the model path automatically";
  const psB = el("button", "pill go", "Make private"); psB.style.marginLeft = "6px";
  psB.onclick = () => { const p = psIn.value.trim(); if (!p) return; act("know_private_source", { pattern: p }, "Source is private").then((r) => { if (!r) return; psIn.value = ""; renderBrain(); }); };
  psIn.onkeydown = (e) => { if (e.key === "Enter" && !imeEnter(e)) psB.onclick(); };
  psCap.append(psIn, psB); card.append(psCap);
  const pdCap = el("div", "sheetrow"); pdCap.style.marginTop = "6px";
  const pd = el("input"); pd.type = "checkbox";
  const pdL = el("label", "note", "new knowledge private by default");
  pdL.title = "Deny-on-unknown: every new fact/link stays off the model path until you unmark it";
  pdL.prepend(pd);
  pd.onchange = () => act("know_private_default", { on: pd.checked }, pd.checked ? "Private by default on" : "Private by default off").then(renderBrain);
  pdCap.append(pdL); card.append(pdCap);
  api("know_private_source").then((r) => {
    pd.checked = !!r.private_by_default;
    if (!r.patterns || !r.patterns.length) return;
    const row = el("div", "note"); row.style.marginTop = "4px";
    row.append(el("span", "", "private sources: "));
    r.patterns.forEach((p) => {
      const tag = el("button", "secondary", p + " ×"); tag.style.marginRight = "6px"; tag.title = "Stop treating this source as private";
      tag.onclick = () => act("know_private_source", { pattern: p, remove: true }, "Removed").then(renderBrain);
      row.append(tag);
    });
    card.append(row);
  }).catch(() => {});
  const edgeList = el("div"); card.append(edgeList);
  api("know_edges").then((r) => {
    if (!r.edges || !r.edges.length) return;
    edgeList.append(el("div", "note", "Relationships"));
    for (const e of r.edges) {
      const row = el("div", "sheetrow");
      const tag = e.expired ? "expired" : e.status;
      const label = knowLabel(tag, e.sensitive, e.subject + " " + e.predicate + " " + e.object, e.source);
      if (e.expired) label.style.opacity = "0.55";
      const rt = el("span", "knowacts");
      if (e.status === "candidate") { const b = el("button", "pill go", "Review"); b.onclick = () => act("know_review_edge", { eid: e.eid }, "Reviewed").then(renderBrain); rt.append(b); }
      if (e.status === "reviewed" && !e.expired) { const b = el("button", "secondary", "Expire"); b.style.marginLeft = "6px"; b.title = "Relationship ended now; kept as history"; b.onclick = () => act("know_expire_edge", { eid: e.eid }, "Expired").then(renderBrain); rt.append(b); }
      { const b = el("button", "secondary", e.sensitive ? "Unmark" : "Private"); b.style.marginLeft = "6px"; b.title = e.sensitive ? "Allow this relationship on the model path again" : "Keep this relationship off the model path"; b.onclick = () => act("know_classify_edge", { eid: e.eid, sensitive: !e.sensitive }, e.sensitive ? "Unmarked" : "Private").then(renderBrain); rt.append(b); }
      row.append(label, rt); edgeList.append(row);
    }
  }).catch(() => {});
  api("know_aging").then((r) => {
    for (const f of (r.aging || [])) {
      const warn = el("div", "note"); warn.style.textAlign = "left";
      warn.append(el("b", "", "Not verified lately — still used: "), document.createTextNode("#" + f.fid + " " + f.text + "  "));
      const b = el("button", "pill go", "Verify"); b.onclick = () => act("know_verify", { fid: f.fid }, "Verified").then(renderBrain);
      warn.append(b); card.append(warn);
    }
  }).catch(() => {});
  api("know_conflicts").then((r) => {
    for (const c of (r.conflicts || [])) {
      const warn = el("div", "note"); warn.style.textAlign = "left";
      warn.append(el("b", "", "Conflict — keep one, retire the other: "));
      for (const side of [c.a, c.b]) {
        warn.append(document.createTextNode(" #" + side.fid + " " + side.text + " "));
        const b = el("button", "secondary", "Retire this"); b.style.margin = "0 10px 0 2px";
        b.onclick = () => act("know_retire", { fid: side.fid }, "Retired").then(renderBrain);
        warn.append(b);
      }
      card.append(warn);
    }
  }).catch(() => {});
  return card;
}

// ---- readiness: what is on, and how to turn on the rest (D186) --------
function doctorCard() {
  const card = el("div", "mem"); card.style.marginTop = "16px";
  const meta = el("div", "meta"); meta.append(el("span", "kind", "readiness")); card.append(meta);
  card.append(el("div", "", "What Orbyn can do on this computer, and the one thing to turn on each missing capability. Nothing leaves this computer; presence only."));
  const list = el("div"); card.append(list);
  api("doctor").then((r) => {
    for (const c of (r.checks || [])) {
      const row = el("div", "sheetrow");
      const dot = el("span", "", c.ready ? "●" : "○"); dot.style.color = c.ready ? "#2a9d57" : "#b7b7b7";
      const label = el("span", "", c.name); const hint = el("span", "note", c.hint); hint.style.marginLeft = "auto";
      row.append(dot, label, hint); list.append(row);
    }
  }).catch(() => list.append(el("div", "note", "Readiness unavailable.")));
  return card;
}

// ---- accounts: the person's own ChatGPT plan or API keys (D182) -------
const PROVIDERS = { anthropic: "Anthropic (Claude) API key", openai: "OpenAI API key", gemini: "Google Gemini API key", openrouter: "OpenRouter API key", nvidia: "NVIDIA NIM API key" };
function accountsCard() {
  const card = el("div", "mem"); card.style.marginTop = "16px";
  const meta = el("div", "meta"); meta.append(el("span", "kind", "accounts")); card.append(meta);
  card.append(el("div", "", "Orbyn runs on your own account: sign in with ChatGPT, or paste an API key. Your plan or credit pays; keys stay in Windows Credential Manager on this computer."));
  const body = el("div"); card.append(body);
  api("accounts").then((a) => {
    const row = (label, right) => { const r = el("div", "sheetrow"); r.append(el("span", "", label), right); right.style.marginLeft = "auto"; body.append(r); };
    const gpt = el("button", a.chatgpt ? "secondary" : "pill go", a.chatgpt ? "Sign out" : "Sign in with ChatGPT");
    gpt.onclick = () => act(a.chatgpt ? "chatgpt_sign_out" : "chatgpt_sign_in", {}, a.chatgpt ? "Signed out" : "Signed in").then(() => renderBrain());
    row("ChatGPT" + (a.chatgpt ? " (signed in)" : ""), gpt);
    for (const [name, label] of Object.entries(PROVIDERS)) {
      if (a.keys[name]) {

        rm.onclick = () => act("key_clear", { name }, "Key removed").then(() => renderBrain());
        row(label + " (saved)", rm);
      } else {

        const save = el("button", "secondary", "Save");
        save.onclick = () => inp.value.trim() && act("key_set", { name, key: inp.value.trim() }, "Key saved").then(() => renderBrain());
        wrap.append(inp, save); row(label, wrap);
      }
    }
    body.append(el("div", "note", "Anthropic does not let other apps use a Claude Free/Pro/Max login, so Claude works here with an API key."));
  }).catch(() => body.append(el("div", "note", "Accounts unavailable.")));
  return card;
}

// ---- sheets: windows, point, teach -----------------------------------
let sheetOpener = null;
function imeEnter(e) { return e.isComposing || e.keyCode === 229; }  // Enter confirming an IME composition
// The browser's blocking confirm and prompt boxes, as a native modal instead.
// Esc or Cancel resolves false/null. Enter in the field submits through the
// form (IME-safe); a confirmation starts on Cancel, the safe choice.
function ask(message, { input = null, ok = "OK", danger = false } = {}) {
  const d = $("ask"), field = $("askInput");
  $("askText").textContent = message; $("askOk").textContent = ok; $("askOk").className = danger ? "secondary danger" : "pill go";
  field.hidden = input === null; field.value = input ?? "";
  d.returnValue = ""; d.showModal(); (input === null ? $("askCancel") : field).focus();
  return new Promise((done) => d.addEventListener("close", () => {
    const yes = d.returnValue === "ok"; d.returnValue = "";
    done(input === null ? yes : yes ? field.value : null);
  }, { once: true }));
}
const askConfirm = (message, ok) => ask(message, { ok, danger: true });
const askText = (message, value = "") => ask(message, { input: value });
$("askCancel").onclick = () => $("ask").close();
function openSheet() { if (!$("sheet").open) $("sheet").showModal(); }
function closeSheet() { if ($("sheet").open) $("sheet").close(); resetSheet(); }
$("sheet").addEventListener("close", resetSheet);  // Esc or a click outside closes it natively
function resetSheet() {
  if ($("sheet").open) return;  // a late close event after another sheet opened
  $("sheet").replaceChildren(); $("sheet").removeAttribute("aria-labelledby");
  if (sheetOpener) {
    const key = sheetOpener.dataset.workFocus;
    const target = sheetOpener.isConnected ? sheetOpener : $("tab-work").querySelector('[data-work-focus="' + (key || "askfile") + '"]');
    sheetOpener = null; target?.focus();
  }
}
if (!("closedBy" in HTMLDialogElement.prototype)) $("sheet").addEventListener("click", (e) => {  // light dismiss where closedby is missing
  const r = $("sheet").getBoundingClientRect();
  if (e.target === $("sheet") && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) closeSheet();
});

async function windowSheet(title, sub, startLabel, extra, onStart) {
  const sheet = $("sheet"); sheet.replaceChildren(el("h3", "", title), el("p", "", sub));
  const list = el("div", "wins"); list.append(el("div", "note", "Finding windows…")); sheet.append(list);
  openSheet();
  const r = await api("windows").catch((e) => (toast(e.message), null));
  list.replaceChildren();
  if (!r || !r.windows.length) { list.append(el("div", "note", "No windows to guide. Open the app you want help with.")); }
  const key = (w) => w.app + "|" + w.title;
  for (const w of (r ? r.windows : [])) {
    const lab = el("label", "win"); const cb = el("input"); cb.type = "checkbox"; cb.checked = chosen.has(key(w)); cb.value = w.n;
    cb.onchange = () => (cb.checked ? chosen.add(key(w)) : chosen.delete(key(w)));
    const d = el("div"); d.append(el("div", "app", w.app.replace(/\.exe$/i, "")), el("div", "title", w.title || "(untitled)"));
    lab.append(cb, d); list.append(lab);
  }
  const row = el("div", "sheetrow");
  if (extra) (Array.isArray(extra) ? extra : [extra]).forEach((e) => row.append(e));
  const cancel = el("button", "secondary", "Cancel"); cancel.onclick = closeSheet;
  const start = el("button", "pill go", startLabel); start.style.marginLeft = "auto";
  start.onclick = () => {
    const nums = [...list.querySelectorAll("input:checked")].map((c) => Number(c.value));
    if (!nums.length) return toast("Choose at least one window.");
    closeSheet(); onStart(nums);
  };
  row.append(cancel, start); sheet.append(row);
}

function openPoint() {
  windowSheet("Point at something", "Which window is it in? Then hover over it and press Enter here.", "Start pointing", null, async (wins) => {
    const r = await act("point", { windows: wins });
    if (!r) return;
    const sheet = $("sheet"); sheet.replaceChildren(el("h3", "", "Is this what you meant?"), el("p", "", r.text));
    const alts = el("div", "alts");
    r.alternatives.forEach((a, i) => { const b = el("button", "secondary", "No — " + a); b.onclick = () => { closeSheet(); act("point_keep", { answer: String(i + 1) }); }; alts.append(b); });
    const row = el("div", "sheetrow");
    const no = el("button", "secondary", "Discard"); no.onclick = () => { closeSheet(); act("point_keep", { answer: "x" }); };
    const yes = el("button", "pill go", "Yes, use it"); yes.style.marginLeft = "auto"; yes.onclick = () => { closeSheet(); act("point_keep", { answer: "" }); };
    row.append(no, yes); sheet.append(alts, row); openSheet();
  });
}

function openTeach(step, doIt) {
  const sel = el("select"); [["300", "5 min"], ["600", "10 min"], ["1200", "20 min"]].forEach(([v, t]) => { const o = el("option", "", t); o.value = v; sel.append(o); });
  const title = (doIt ? "Do it for me from step " : "Guide me from step ") + step;
  const note = doIt
    ? "Choose the windows to work across. Orbyn shows the plan; press Done to approve, then it clicks and types for you. ESC stops it at once."
    : "Choose the windows to work across. Orbyn points; you click. Press Enter here when a step is done.";
  const deny = doIt ? el("input") : null;
  if (deny) { deny.placeholder = "never click (comma-separated): delete, send, pay"; deny.value = "delete, send, pay, buy, remove"; }
  windowSheet(title, note, doIt ? "Approve and start" : "Start guiding", deny ? [sel, deny] : sel, async (wins) => {
    setTab("chat");
    const body = { step, windows: wins, seconds: Number(sel.value) };
    if (deny) body.deny = deny.value.split(",").map((s) => s.trim()).filter(Boolean);
    const r = await act(doIt ? "act" : "teach", body);
    if (r) toast(r.result, true);
  });
}

// ---- composer ---------------------------------------------------------
function setResearch(on) {
  researchMode = on; $("researchBtn").setAttribute("aria-pressed", String(on));
  $("composer").classList.toggle("research", on);
  $("input").placeholder = on ? "Ask the web — answers cite their sources…" : "Message Orbyn…";
}
async function send() {
  const inp = $("input"); const text = inp.value.trim();
  if (!text || (S && S.busy)) return;
  finishWelcome();
  inp.value = ""; pending = researchMode ? "[research] " + text : text;
  const action = researchMode ? "research" : "say";
  setTab("chat"); renderChat(true);
  try { await api(action, { text }); } catch (e) { toast(e.message); inp.value = text; }
  pending = ""; await poll(true); renderChat(true);
}
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !imeEnter(e) && !(S && S.busy)) { e.preventDefault(); send(); } });
$("sendBtn").onclick = send;
$("researchBtn").onclick = () => setResearch(!researchMode);
$("pointBtn").onclick = openPoint;
$("voiceBtn").onclick = async () => {
  const r = await act("voice", {});
  if (r && r.draft) { $("input").value = r.draft; $("input").focus(); }
  else if (r) toast("Nothing was heard.");
};
$("doneBtn").onclick = () => api("signal").catch(() => {});
$("stopBtn").onclick = () => api("stop").catch(() => {});
// Closing the window mid-session stops it (ESC and the deadline do anyway).
addEventListener("pagehide", () => {
  if (S && S.busy && !S.background_id && !backgroundStarting) fetch("/api/stop", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json", "X-Orbyn-Token": TOKEN }, body: "{}" });
});
document.addEventListener("keydown", (e) => {
  if (!S || !S.busy) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "Enter" && !$("ask").open && ["Guiding", "Pointing", "Listening"].includes(S.busy)) { e.preventDefault(); api("signal").catch(() => {}); }
  if (e.key === "Escape") api("stop").catch(() => {});
});

function setTab(name) {
  tab = name;
  document.querySelectorAll("nav button").forEach((b) => {
    const active = b.dataset.tab === name;
    b.setAttribute("aria-selected", String(active)); b.tabIndex = active ? 0 : -1;
  });
  for (const t of ["chat", "plan", "brain", "work"]) $("tab-" + t).hidden = t !== name;
  if (S) render(name === "chat");
}
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
document.querySelector("nav").addEventListener("keydown", (e) => {
  const tabs = [...document.querySelectorAll('nav button[role="tab"]')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  const next = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
  setTab(tabs[next].dataset.tab); tabs[next].focus(); e.preventDefault();
});

// theme
$("themeBtn").innerHTML = ICON.moon;
$("themeBtn").onclick = () => {
  // The opposite of what is shown; choosing what Windows already uses clears
  // the override, so the page follows Windows again.
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(next);
  try { if (next === systemTheme()) localStorage.removeItem("orbyn-theme"); else localStorage.setItem("orbyn-theme", next); } catch {}
};

$("pointBtn").innerHTML = ICON.point + "Point";
$("voiceBtn").innerHTML = ICON.mic + "Voice";
$("researchBtn").innerHTML = ICON.globe + "Research";
$("sendBtn").innerHTML = ICON.send;
if (["plan", "brain", "work"].includes(location.hash.slice(1))) setTab(location.hash.slice(1));
poll(true);
